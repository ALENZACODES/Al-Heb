name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Unit tier (fast)
        run: npm test
      - name: Precache manifest is current
        run: node tools/build-precache.mjs && git diff --exit-code precache-manifest.js
  build-dist:
    # Builds dist/ exactly as the Cloudflare Pages build command does, verifies every precache URL exists in it,
    # then runs the local deploy check (headers, MIME, service worker scope, fonts, CSP, size limits).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node tools/deploy/build_site.mjs
      - run: node tools/deploy/check-deploy.mjs --root dist
  smoke:
    # Playwright browser smoke. continue-on-error because the browser download (`playwright install --with-deps`) needs the network
    # and apt on the runner and has NOT been run on GitHub yet; a failure here is an install problem until proven otherwise.
    # The `test` job does not depend on it: browser tests inside `node --test` skip cleanly when Playwright or axe-core is absent.
    runs-on: ubuntu-latest
    needs: test
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-save --no-package-lock playwright && npx playwright install --with-deps chromium
      - name: Browser tier
        run: npm run test:browser
      - run: node tools/smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: screens, path: docs/screens }
