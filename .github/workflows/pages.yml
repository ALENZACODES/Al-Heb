name: pages
# Builds the static site (tools/build-static.mjs) and deploys it to GitHub Pages.
# One-time setup in the repository: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
# Build and validate on every main push. Publishing is explicitly enabled after Pages is configured.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install test dependencies
        run: python -m pip install Pillow==11.3.0 segno==1.6.6
      - name: Tests (no dependencies to install)
        run: npm test
      - name: Build static site
        # Project sites live at https://<user>.github.io/<repo>/ ; all URLs in the app are relative so no rewrite is needed.
        run: node tools/build-static.mjs --base "/${GITHUB_REPOSITORY#*/}/"
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
  deploy:
    if: vars.ENABLE_GITHUB_PAGES == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
