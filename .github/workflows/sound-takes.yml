name: sound-takes
# Fresh takes of the letter sounds, letter names and syllables the sound check says to listen to
# (docs/audio/SOUNDS-CHECK.md), in the same Israeli WaveNet voices, then a machine pick of the best take of each
# (tools/audio/asr-check/sound_takes.py). Runs when tools/audio/asr-check/sound-takes-queue.txt changes on the sound-check
# branch or on main, or by hand. Needs the repository secret GOOGLE_TTS_API_KEY.
# Takes and picks are pushed to the branch john/sound-takes-r<run>; nothing in the app changes until a pick is applied.
on:
  push:
    branches: [main, 'claude/sound-check-builder-words-2026-11-16']
    paths: ['tools/audio/asr-check/sound-takes-queue.txt']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sound-takes
  cancel-in-progress: false
jobs:
  record:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      LANG: C.UTF-8
      GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/audio
            data/audio
            audio/f/israeli/letter
            audio/f/israeli/vowel
            audio/f/israeli/syllable
            audio/m/israeli/letter
            audio/m/israeli/vowel
            audio/m/israeli/syllable
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: '3.12' }
      - run: (sudo apt-get -qq update && sudo apt-get -qq install -y --no-install-recommends ffmpeg) || (pip install -q imageio-ffmpeg && sudo ln -sf "$(python -c 'import imageio_ffmpeg;print(imageio_ffmpeg.get_ffmpeg_exe())')" /usr/local/bin/ffmpeg)
      - name: Sound model and the tools
        run: |
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q transformers ctranslate2==4.8.5 faster-whisper numpy "git+https://github.com/thewh1teagle/phonikud"
          ct2-transformers-converter --model renikud/whisper-he-ipa --revision e709a907f8e0e6ebcb83340b8563818dd1bc3bee \
            --output_dir /tmp/phoneme-ct2 --quantization int8 --copy_files tokenizer.json preprocessor_config.json
      - name: Record the takes
        run: python tools/audio/asr-check/sound_takes.py --record
      - name: Pick the best take of each
        run: python tools/audio/asr-check/sound_takes.py --pick --model /tmp/phoneme-ct2
      - name: Push the takes and picks
        if: always()
        run: |
          [ -d audio-takes/sound-check ] || exit 0
          b=john/sound-takes-r${{ github.run_number }}
          auth=$(git config --get http.https://github.com/.extraheader)
          rm -rf /tmp/out && mkdir -p /tmp/out/audio-takes && cp -r audio-takes/sound-check /tmp/out/audio-takes/ && cd /tmp/out
          git init -q && git checkout -q -b "$b" && git config user.name "John Khan" && git config user.email "309250657+ALENZACODES@users.noreply.github.com"
          git add -A && git commit -q -m "Sound takes: $(ls audio-takes/sound-check/*.mp3 | wc -l) takes and the machine picks"
          for i in 1 2 3 4 5; do git -c http.https://github.com/.extraheader="$auth" push -q --force "https://github.com/${{ github.repository }}.git" HEAD:refs/heads/$b && break; sleep $((i*20)); done
