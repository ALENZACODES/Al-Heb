name: word-takes
# Fresh takes of the words the two audio reviewers flagged (tools/audio/asr-check/retake-list.json), in the same Israeli WaveNet
# voices. Runs when tools/audio/asr-check/retake-queue.txt changes on main, or by hand. Needs the repository secret GOOGLE_TTS_API_KEY.
# Takes are pushed to the branch john/word-takes; nothing in the app changes until they are reviewed and picked.
on:
  push:
    branches: [main]
    paths: ['tools/audio/asr-check/retake-queue.txt']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: word-takes
  cancel-in-progress: false
jobs:
  record:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Record takes
        run: python3 tools/audio/render_word_takes.py
      - name: Push takes to john/word-takes (in batches, a single large push is refused)
        run: |
          git config user.name "John Khan"
          git config user.email "johnnykhan1@gmail.com"
          git config http.postBuffer 524288000
          git checkout -q -B john/word-takes
          first=1
          ls audio-takes/*/*.mp3 | split -l 300 - /tmp/batch-
          for b in /tmp/batch-*; do
            xargs -a "$b" git add
            git commit -q -m "Word takes: batch $(basename "$b")"
            if [ "$first" = 1 ]; then git push -q --force origin HEAD:refs/heads/john/word-takes; first=0; else git push -q origin HEAD:refs/heads/john/word-takes; fi
          done
          git add audio-takes/takes.json
          git commit -q -m "Word takes: index ($(python3 -c "import json;print(len(json.load(open('audio-takes/takes.json'))))") takes)"
          git push -q origin HEAD:refs/heads/john/word-takes
