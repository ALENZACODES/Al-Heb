svg.morph.morph-play .morph-pop-late{animation-delay:.2s}
svg.morph.morph-show-a *{animation:none!important}}
@keyframes morph-a{0%,18%{opacity:1}38%,86%{opacity:0}100%{opacity:1}}
@keyframes morph-b{0%,18%{opacity:0}38%,86%{opacity:1}100%{opacity:0}}
@keyframes morph-trace{0%,18%{opacity:1;stroke-width:85}38%,86%{opacity:.6;stroke-width:14}100%{opacity:1;stroke-width:85}}
@keyframes morph-pop{0%,22%{opacity:0;transform:scale(.3)}42%,86%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.3)}}
@media (prefers-reduced-motion:reduce){svg.morph,svg.morph *{animation:none!important;transition:none!important}}
svg.morph-dalet .L{fill:none;stroke:var(--m-2);stroke-width:64;stroke-linecap:round;stroke-linejoin:round}
svg.morph-dalet .o{fill:none;stroke:var(--m-ink);stroke-width:14;stroke-linecap:round;stroke-linejoin:round}
svg.morph-dalet .s{fill:var(--m-ink);fill-opacity:.3}
svg.morph-dalet .p{fill:var(--m-2);fill-opacity:.25}
svg.morph-dalet .t{fill:none;stroke:var(--m-ink);stroke-width:10;stroke-linecap:round}
svg.morph-dalet .d{fill:var(--m-ink)}
svg.morph-dalet .m{fill:none;stroke:var(--m-ink);stroke-opacity:.5;stroke-linecap:round}
svg.morph-dalet .g{fill:none;stroke:var(--m-ink);stroke-width:9;stroke-dasharray:28 22;stroke-linecap:round;opacity:.55}
@media (forced-colors:active){svg.morph-dalet .s,svg.morph-dalet .p{fill:Canvas;fill-opacity:1}}</style>
