<svg xmlns="http://www.w3.org/2000/svg" class="morph morph-mem-final" viewBox="0 0 200 200" role="img" aria-labelledby="mem-final-t mem-final-d">
<title id="mem-final-t">Final mem becomes a zipped tent by the sea with mom at the door</title>
<desc id="mem-final-d">A green camping tent with a zipped orange door flap, the letter box is the door with a zipper and pull. Pegs and a guy rope hold it down on the shore with waves at the foot, and a mother in a blue dress stands at the door.</desc>
<style>/*morph-contract 1*/
svg.morph{--m-ink:var(--morph-ink,currentColor);--m-1:var(--morph-1,#d9480f);--m-2:var(--morph-2,#1b3a6b);--m-3:var(--morph-3,#ffd966);--m-4:var(--morph-4,#2f9e44)}
@media (prefers-color-scheme:dark){svg.morph{--m-ink:var(--morph-ink,#f3ecdc);--m-1:var(--morph-1,#ff8a4c);--m-2:var(--morph-2,#8db8ff);--m-3:var(--morph-3,#ffe08a);--m-4:var(--morph-4,#69db7c)}}
@media (forced-colors:active){svg.morph{--m-ink:CanvasText;--m-1:Highlight;--m-2:CanvasText;--m-3:GrayText;--m-4:LinkText}}
