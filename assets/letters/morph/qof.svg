<g class="morph-b"><rect class="mtile" x="6" y="6" width="188" height="188" rx="26"/><circle class="mf3" cx="30" cy="30" r="10"/><path class="mtile" d="M130 168a9 9 0 0 1 3-17a13 13 0 0 1 25-2a10 10 0 0 1 9 19z"/><path class="mf1" d="M42 41L100 8L158 41L108 152Z"/><path class="mf3" d="M100 8L158 41H100ZM42 41H100L108 152Z"/><use href="#qof-g" transform="translate(0 -8) scale(.2)" class="mfi"/><path class="mf1" d="M58 100L47 94V106ZM58 100L69 94V106ZM58 124L47 118V130ZM58 124L69 118V130ZM58 148L47 142V154ZM58 148L69 142V154ZM58 172L47 166V178ZM58 172L69 166V178Z"/></g>
