<g class="morph-b"><rect class="mtile" x="6" y="6" width="188" height="188" rx="26"/><path class="mshade" d="M148 112L192 150H148Z"/><circle class="mf1" cx="160" cy="108" r="10"/><path class="mf3" d="M58 50H92Q142 52 142 112V151H112Q96 152 84 150Q58 144 50 132Q47 118 49 106Q38 104 42 96Q48 90 47 80Q50 62 58 50Z"/><use href="#resh-g" transform="translate(0 0) scale(.2)" class="mfi"/><path class="mf1" d="M46 112L70 119L48 133Z"/><circle class="mfi" cx="74" cy="82" r="4"/><path class="msi" d="M64 70L86 77M34 106Q27 118 34 130M26 98Q14 118 26 138"/></g>
</svg>
