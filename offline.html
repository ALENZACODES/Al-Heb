<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#16301c">
  <meta name="color-scheme" content="light dark">
  <title>ALEF — offline</title>
  <link rel="icon" href="assets/icons/icon-192.png" type="image/png">
  <style>
    :root { color-scheme: light dark; }
    body { font: 1.1rem/1.5 system-ui, -apple-system, sans-serif; max-width: 32rem; margin: 3rem auto; padding: 0 max(1rem, env(safe-area-inset-left)) env(safe-area-inset-bottom); background: #16301c; color: #f6efe0; }
    h1 { font-size: 1.6rem; color: #f3dfa6; }
    a { color: #e8c97a; display: inline-flex; align-items: center; justify-content: center; min-block-size: 44px; min-inline-size: 44px; padding: 0.5rem 0.75rem; }
    @media (prefers-color-scheme: light) {
      body { background: #f6efe0; color: #16301c; }
      h1 { color: #16301c; }
      a { color: #1c4023; }
    }
  </style>
</head>
<body>
  <main>
    <h1>You are offline</h1>
    <p>ALEF could not load this page. It is not saved on this device yet. Reconnect and open ALEF once to use it offline.</p>
    <p><a href="./">Try again</a></p>
  </main>
</body>
</html>
