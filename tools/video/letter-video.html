<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<style>
@font-face{font-family:Heebo;src:url(../../assets/fonts/web/heebo.woff2) format("woff2")}
@font-face{font-family:FRL;src:url(../../assets/fonts/web/frank-ruhl-libre.woff2) format("woff2")}
html,body{margin:0;width:720px;height:720px;overflow:hidden;background:#163527;font-family:Heebo,system-ui,sans-serif}
#stage{position:relative;width:720px;height:720px;background:radial-gradient(circle at 50% 42%,#24533d 0,#163527 62%)}
#top{position:absolute;top:34px;left:0;right:0;text-align:center;color:#f2d27c;font-weight:800;font-size:34px;letter-spacing:.02em}
#svg{position:absolute;left:150px;top:96px;width:420px;height:420px}
#name{position:absolute;top:520px;left:0;right:0;text-align:center;color:#fffaf0;font-size:46px;font-weight:800}
#name .he{font-family:FRL,serif;color:#f2d27c;margin-left:14px;font-size:52px}
#sound{position:absolute;top:592px;left:60px;right:60px;text-align:center;color:#e9e1cb;font-size:25px;line-height:1.3}
#brand{position:absolute;bottom:18px;left:22px;color:#d4a647;font-weight:800;font-size:22px}
#brand span{font-family:FRL,serif;margin-left:6px}
#rimon{position:absolute;right:16px;bottom:12px;width:104px;transform-origin:50% 90%;border-radius:22px;border:3px solid #d4a647;box-shadow:0 4px 14px #0006}
.dot{fill:#d4a647}
.num{fill:#163527;font:800 44px Heebo,sans-serif;text-anchor:middle;dominant-baseline:central}
</style></head>
<body><div id="stage">
<div id="top"></div>
<svg id="svg" viewBox="0 0 1000 1000"><g id="guide"></g><g id="ink"></g><g id="dots"></g></svg>
<div id="name"></div><div id="sound"></div>
<div id="brand">Aleph<span>אָלֶף</span></div>
<img id="rimon" alt="">
</div>
<script>
const NS='http://www.w3.org/2000/svg';
let L=null, paths=[], lens=[], T={};
const ease=(x)=>x<0?0:x>1?1:1-Math.pow(1-x,3);
window.setup=(letter, timing, rimonUrl)=>{
  L=letter; T=timing;
  document.getElementById('rimon').src=rimonUrl;
  document.getElementById('top').textContent=letter.name;
  const name=document.getElementById('name'); name.innerHTML='';
  name.append(letter.name); const he=document.createElement('span'); he.className='he'; he.lang='he'; he.dir='rtl'; he.textContent=letter.nameHe; name.append(he);
  document.getElementById('sound').textContent=letter.sound;
  const g=document.getElementById('guide'), ink=document.getElementById('ink'), dots=document.getElementById('dots');
  for (const s of letter.strokes) {
    const gp=document.createElementNS(NS,'path'); gp.setAttribute('d',s.path); gp.setAttribute('fill','none'); gp.setAttribute('stroke','#ffffff1f'); gp.setAttribute('stroke-width','92'); gp.setAttribute('stroke-linecap','round'); gp.setAttribute('stroke-linejoin','round'); g.append(gp);
    const p=document.createElementNS(NS,'path'); p.setAttribute('d',s.path); p.setAttribute('fill','none'); p.setAttribute('stroke','#f2d27c'); p.setAttribute('stroke-width','88'); p.setAttribute('stroke-linecap','round'); p.setAttribute('stroke-linejoin','round'); ink.append(p);
    const len=p.getTotalLength(); p.style.strokeDasharray=`${len} ${len}`; paths.push(p); lens.push(len);
  }
  letter.strokes.forEach((s,i)=>{ const [x,y]=s.median[0]; const c=document.createElementNS(NS,'circle'); c.setAttribute('cx',x); c.setAttribute('cy',y); c.setAttribute('r',34); c.setAttribute('class','dot'); const t=document.createElementNS(NS,'text'); t.setAttribute('x',x); t.setAttribute('y',y); t.setAttribute('class','num'); t.textContent=String(i+1); const gg=document.createElementNS(NS,'g'); gg.append(c,t); gg.dataset.i=i; dots.append(gg); });
  return document.fonts.ready.then(()=>true);
};
window.render=(t)=>{
  const n=paths.length, each=(T.drawEnd-T.drawStart)/n;
  paths.forEach((p,i)=>{ const k=ease((t-T.drawStart-i*each)/each); p.style.strokeDashoffset=String(lens[i]*(1-k)); });
  document.querySelectorAll('#dots g').forEach((g)=>{ const i=+g.dataset.i; const on=t>=T.drawStart+i*each-0.25 && t<T.drawStart+(i+1)*each; g.style.opacity=on?1:0; });
  const a=(x0,x1)=>Math.max(0,Math.min(1,(t-x0)/(x1-x0)));
  document.getElementById('top').style.opacity=a(0,0.5);
  document.getElementById('name').style.opacity=a(T.nameAt-0.2,T.nameAt+0.3);
  document.getElementById('name').style.transform=`translateY(${(1-ease(a(T.nameAt-0.2,T.nameAt+0.4)))*16}px)`;
  document.getElementById('sound').style.opacity=a(T.soundAt-0.2,T.soundAt+0.3);
  const ink=document.getElementById('ink'); ink.style.filter=t>T.drawEnd?`drop-shadow(0 0 ${8+6*Math.sin((t-T.drawEnd)*3)}px #f2d27c88)`:'none';
  const bob=Math.sin(t*2.4)*0.03, cheer=t>T.nameAt&&t<T.nameAt+0.8?Math.sin((t-T.nameAt)*Math.PI/0.8)*0.12:0;
  document.getElementById('rimon').style.transform=`scale(${1+bob+cheer},${1-bob*0.5+cheer}) rotate(${cheer*20}deg)`;
};
</script></body></html>
